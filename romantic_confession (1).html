<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fce7f3 0%, #ffe4e6 50%, #fbcfe8 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .romantic-font {
            font-family: 'Caveat', cursive;
        }
        
        /* Анимации плавного появления */
        .fade-in {
            animation: fadeIn 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hidden-screen {
            display: none !important;
        }

        /* Пульсирующее сердечко */
        .pulse-heart {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Анимация летающих цветов на финальном экране */
        .floating {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        #no-btn {
            transition: all 0.2s ease-out;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-gray-800 p-4 relative">

    <!-- ЭКРАН 1: Уведомление -->
    <div id="screen-1" class="w-full max-w-md bg-white/90 backdrop-blur-sm rounded-3xl shadow-2xl p-8 text-center transform transition-all border border-pink-100">
        <div class="text-6xl mb-4 pulse-heart">💌</div>
        <h2 class="text-2xl font-bold text-gray-700 mb-6">У тебя новое сообщение</h2>
        <button onclick="showScreen2()" class="bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 px-8 rounded-full shadow-lg shadow-rose-200 transition-all hover:scale-105 active:scale-95 text-lg w-full sm:w-auto">
            Открыть
        </button>
    </div>

    <!-- ЭКРАН 2: Основной контент (текст, видео, вопрос) -->
    <div id="screen-2" class="hidden-screen w-full max-w-2xl bg-white/90 backdrop-blur-sm rounded-3xl shadow-2xl p-6 md:p-10 text-center border border-pink-100 my-8">
        
        <p class="romantic-font text-3xl md:text-4xl text-gray-800 mb-8 leading-relaxed">
            «Знаю, первые отношения у нас не задались. Я знаю, что в них была моя вина. Я осознал все свои ошибки, и я теперь другой.»
        </p>

        <!-- Видео (Локальный файл) -->
        <div class="w-full flex justify-center mb-8">
            <video id="myVideo" src="video.mp4" controls style="width: 100%; max-width: 800px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);"></video>
        </div>

        <!-- Блок, который появится ТОЛЬКО после просмотра видео -->
        <div id="after-video-content" class="hidden-screen">
            <h3 class="text-2xl md:text-3xl font-bold text-gray-700 mb-8 mt-4">Будешь моей девушкой?</h3>

            <div class="flex flex-col sm:flex-row justify-center items-center gap-4 relative mt-8 h-32 sm:h-auto">
                <button onclick="showScreen3()" class="bg-gradient-to-r from-rose-400 to-pink-500 hover:from-rose-500 hover:to-pink-600 text-white font-bold py-3 px-12 rounded-full shadow-lg shadow-pink-200 transition-all hover:scale-110 active:scale-95 text-xl z-10">
                    Да! 🥰
                </button>
                <button id="no-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-600 font-bold py-3 px-12 rounded-full shadow-md text-xl z-20">
                    Нет
                </button>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 3: Празднование (Мишка и цветы) -->
    <div id="screen-3" class="hidden-screen w-full h-full fixed inset-0 flex flex-col items-center justify-center bg-gradient-to-br from-pink-200 to-red-100 z-50 p-4">
        
        <!-- Падающие/летающие элементы вокруг -->
        <div class="absolute inset-0 overflow-hidden pointer-events-none text-4xl opacity-60">
            <div class="absolute top-10 left-[10%] floating" style="animation-delay: 0s;">🌸</div>
            <div class="absolute top-20 right-[15%] floating" style="animation-delay: 1s;">🌹</div>
            <div class="absolute top-1/3 left-[5%] floating" style="animation-delay: 2s;">🌺</div>
            <div class="absolute bottom-1/4 right-[10%] floating" style="animation-delay: 0.5s;">💖</div>
            <div class="absolute bottom-10 left-[20%] floating" style="animation-delay: 1.5s;">🌷</div>
            <div class="absolute top-1/2 right-[5%] floating" style="animation-delay: 2.5s;">✨</div>
        </div>

        <div class="relative z-10 text-center flex flex-col items-center">
            <div class="text-[120px] md:text-[180px] leading-none mb-4 floating pulse-heart">
                🧸
            </div>
            <div class="text-4xl md:text-5xl mb-6">🌹🌸🌺🌹🌸</div>
            <h1 class="romantic-font text-6xl md:text-8xl text-rose-600 font-bold drop-shadow-md text-center px-4">
                Я тебя люблю ❤️
            </h1>
            <p class="text-xl md:text-2xl text-gray-700 mt-4 font-semibold">
                Я сделаю тебя самой счастливой!
            </p>
        </div>
    </div>

    <script>
        const screen1 = document.getElementById('screen-1');
        const screen2 = document.getElementById('screen-2');
        const screen3 = document.getElementById('screen-3');
        const noBtn = document.getElementById('no-btn');
        const afterVideoContent = document.getElementById('after-video-content');
        const myVideo = document.getElementById('myVideo');

        // Переход от уведомления к основному сообщению
        function showScreen2() {
            screen1.classList.add('hidden-screen');
            screen2.classList.remove('hidden-screen');
            screen2.classList.add('fade-in');
            
            // Автоматический запуск видео при открытии
            if (myVideo) {
                myVideo.play().catch(e => console.log("Автовоспроизведение заблокировано браузером", e));
            }
        }

        // Переход к праздничному экрану
        function showScreen3() {
            screen2.classList.add('hidden-screen');
            screen3.classList.remove('hidden-screen');
            screen3.classList.add('fade-in');
        }

        // Отслеживаем завершение локального видео
        if (myVideo) {
            myVideo.addEventListener('ended', () => {
                afterVideoContent.classList.remove('hidden-screen');
                afterVideoContent.classList.add('fade-in');
                
                // Прокручиваем страницу вниз к вопросу
                setTimeout(() => {
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                }, 100);
            });
        }

        // Логика кнопки "Нет" (убегает или исчезает)
        
        // Функция для перемещения кнопки
        function moveButton() {
            // На мобильных устройствах просто скрываем кнопку, чтобы не ломать экран
            if (window.innerWidth < 768) {
                noBtn.style.opacity = '0';
                noBtn.style.pointerEvents = 'none';
                noBtn.style.transform = 'scale(0)';
                return;
            }

            // На ПК кнопка убегает
            const container = noBtn.parentElement;
            
            // Включаем абсолютное позиционирование для кнопки "Нет"
            noBtn.style.position = 'absolute';
            
            // Генерируем случайные координаты в пределах экрана
            const maxX = window.innerWidth - noBtn.offsetWidth - 40;
            const maxY = window.innerHeight - noBtn.offsetHeight - 40;
            
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // События для убегания кнопки (mouseenter для мыши, touchstart для сенсорных экранов)
        noBtn.addEventListener('mouseenter', moveButton);
        noBtn.addEventListener('touchstart', moveButton);
        
        // На случай, если все же удалось нажать
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            noBtn.style.opacity = '0';
            noBtn.style.pointerEvents = 'none';
            noBtn.style.transform = 'scale(0)';
        });
    </script>
</body>
</html>
